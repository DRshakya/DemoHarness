name: Locator Strategy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  locator-strategy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enforce locator fallback strategy
        run: node scripts/check-locator-strategy.js
